# .github/workflows/dependency-graph.yml
name: Update Dependency Graph
on:
  push:
    branches:
      - master # default branch of the project
  workflow_dispatch:

permissions:
  contents: write # for dependency graph upload

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  dependency-graph:
    name: Update Dependency Graph
    runs-on: ubuntu-latest
    steps:
      - name: Install JVM 21 + sbt
        uses: coursier/setup-action@648df969f41ef15fda2baba8b37f9fa3d16390a3 # v3
        with:
          jvm: temurin:21
          apps: sbt
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: SBT dependency submission
        uses: scalacenter/sbt-dependency-submission@v3
